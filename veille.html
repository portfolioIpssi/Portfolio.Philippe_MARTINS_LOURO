<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Veille Technologique - Philippe Martins Louro</title>
  
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #ec4899;
      --accent: #06b6d4;
      --bg-light: #ffffff;
      --bg-gray: #f9fafb;
      --text-dark: #1f2937;
      --text-medium: #6b7280;
      --text-light: #9ca3af;
      --shadow: 0 10px 30px rgba(99, 102, 241, 0.1);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 50px rgba(99, 102, 241, 0.15);
      --radius: 16px;
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      background-attachment: fixed;
      color: var(--text-dark);
      line-height: 1.6;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(249,250,251,0.98));
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 50px;
      z-index: 1000;
      border-bottom: 2px solid rgba(99, 102, 241, 0.1);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .nav-container {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-menu {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-medium);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: var(--transition);
      text-decoration: none;
    }

    .nav-btn:hover,
    .nav-btn.active {
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: var(--shadow);
    }

    .theme-toggle {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));
      border: 1px solid rgba(99, 102, 241, 0.2);
      width: 44px;
      height: 44px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover {
      background: var(--primary);
      color: white;
      transform: scale(1.1);
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
    }

    .hamburger span {
      width: 25px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 2px;
      transition: var(--transition);
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(8px, -8px);
    }

    .progress-bar {
      position: fixed;
      top: 79px;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
      width: 0%;
      z-index: 999;
    }

    .main-container {
      max-width: 1200px;
      margin: 120px auto 100px;
      padding: 0 30px;
    }

    .window {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(99, 102, 241, 0.1);
      margin-bottom: 50px;
    }

    .window-header {
      padding: 40px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(236, 72, 153, 0.08));
      border-bottom: 2px solid rgba(99, 102, 241, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .window-title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .window-controls {
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.2);
      cursor: pointer;
      transition: var(--transition);
    }

    .dot:hover {
      background: var(--primary);
      transform: scale(1.3);
    }

    .window-content {
      padding: 50px;
    }

    h2 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 3px solid var(--accent);
      font-weight: 800;
    }

    h3 {
      font-size: 1.5rem;
      color: var(--secondary);
      margin: 35px 0 15px;
      font-weight: 700;
    }

    p {
      color: var(--text-medium);
      font-size: 0.98rem;
      margin-bottom: 18px;
      line-height: 1.8;
    }

    strong {
      color: var(--primary);
      font-weight: 700;
    }

    ul {
      margin-left: 30px;
      margin-bottom: 20px;
    }

    li {
      margin-bottom: 12px;
      color: var(--text-medium);
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    a:hover {
      color: var(--secondary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 28px;
      margin: 35px 0;
    }

    .card {
      background: linear-gradient(135deg, var(--bg-light), var(--bg-gray));
      padding: 35px;
      border-radius: 12px;
      transition: var(--transition);
      border: 1px solid rgba(99, 102, 241, 0.1);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }

    .card-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .card-desc {
      color: var(--text-medium);
      font-size: 0.95rem;
    }
